# Patent Intelligence - Render Infrastructure Configuration
# =========================================================
# Static site deployment for the Patent Intelligence frontend.
# Backend services (API, worker, Redis, DB) are managed separately.

services:
  # Static Site - React/Vite Frontend
  - type: web
    name: patent-intelligence
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
